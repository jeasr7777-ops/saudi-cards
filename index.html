<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Penalty Realistic</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050807;
    font-family:Arial,sans-serif;
    touch-action:none;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.game{
    position:relative;
    width:100%;
    max-width:1200px;
    height:100vh;
    overflow:hidden;
    background:#08120d;
}

/* =========================
   CAMERA
========================= */

.camera{
    position:absolute;
    inset:0;
    overflow:hidden;
    transition:transform .15s;
}

.camera.shake{
    animation:shake .28s;
}

@keyframes shake{
    0%{transform:translate(0,0)}
    25%{transform:translate(-5px,3px)}
    50%{transform:translate(5px,-3px)}
    75%{transform:translate(-3px,2px)}
    100%{transform:translate(0,0)}
}

/* =========================
   STADIUM
========================= */

.stadium{
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            ellipse at 50% 25%,
            rgba(255,255,255,.12),
            transparent 35%
        ),
        linear-gradient(
            to bottom,
            #202b2b 0%,
            #111817 25%,
            #0b3b20 55%,
            #06321b 100%
        );
}

.lights{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:130px;
    background:
        radial-gradient(circle at 15% 20%,rgba(255,255,255,.8),transparent 3%),
        radial-gradient(circle at 30% 10%,rgba(255,255,255,.8),transparent 3%),
        radial-gradient(circle at 50% 5%,rgba(255,255,255,.8),transparent 3%),
        radial-gradient(circle at 70% 10%,rgba(255,255,255,.8),transparent 3%),
        radial-gradient(circle at 85% 20%,rgba(255,255,255,.8),transparent 3%);
    opacity:.8;
}

.crowd{
    position:absolute;
    top:60px;
    left:0;
    right:0;
    height:190px;
    opacity:.65;
    background:
        repeating-linear-gradient(
            90deg,
            #101616 0 12px,
            #252b2a 12px 22px,
            #151b1a 22px 35px
        );
    filter:blur(2px);
}

.field{
    position:absolute;
    left:-15%;
    right:-15%;
    bottom:-30%;
    height:75%;
    transform:perspective(600px) rotateX(55deg);
    transform-origin:bottom;
    background:
        repeating-linear-gradient(
            90deg,
            #075524 0 80px,
            #08602a 80px 160px
        );
}

.field::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(0,0,0,.25)
        );
}

/* =========================
   GOAL
========================= */

.goal{
    position:absolute;
    width:min(88vw,950px);
    height:min(55vw,500px);
    max-height:500px;
    left:50%;
    top:13%;
    transform:translateX(-50%);
    perspective:900px;
}

.goal-depth{
    position:absolute;
    inset:0;
    transform:perspective(900px) rotateX(2deg);
}

.net{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            rgba(255,255,255,.22) 2px,
            transparent 2px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.22) 2px,
            transparent 2px
        );

    background-size:32px 32px;

    border:8px solid #eeeeee;

    box-shadow:
        0 0 10px rgba(0,0,0,.7),
        inset 0 0 60px rgba(0,0,0,.35);
}

/* قوائم المرمى */

.post{
    position:absolute;
    background:linear-gradient(
        90deg,
        #aaa,
        #fff,
        #bbb
    );
    box-shadow:0 4px 10px #000;
    z-index:10;
}

.post.left{
    left:-10px;
    top:-5px;
    width:14px;
    height:105%;
}

.post.right{
    right:-10px;
    top:-5px;
    width:14px;
    height:105%;
}

.post.top{
    top:-10px;
    left:-5px;
    width:101%;
    height:15px;
}

/* =========================
   TARGET
========================= */

.target{
    position:absolute;
    inset:0;
    z-index:20;
}

.crosshair{
    position:absolute;
    width:50px;
    height:50px;
    border:2px solid #ffcc00;
    border-radius:50%;
    transform:translate(-50%,-50%);
    display:none;
    pointer-events:none;
    box-shadow:
        0 0 20px rgba(255,204,0,.8);
}

.crosshair::before,
.crosshair::after{
    content:"";
    position:absolute;
    background:#ffcc00;
}

.crosshair::before{
    width:70px;
    height:2px;
    left:-12px;
    top:23px;
}

.crosshair::after{
    height:70px;
    width:2px;
    top:-12px;
    left:23px;
}

/* =========================
   KEEPER
========================= */

.keeper{
    position:absolute;
    width:145px;
    height:260px;
    left:50%;
    bottom:-12px;
    transform:translateX(-50%);
    z-index:35;

    transition:
        left .35s cubic-bezier(.2,.8,.2,1),
        transform .35s cubic-bezier(.2,.8,.2,1);
}

.keeper-head{
    position:absolute;
    width:48px;
    height:48px;
    left:50%;
    top:5px;
    transform:translateX(-50%);
    border-radius:50%;
    background:
        radial-gradient(
            circle at 35% 30%,
            #e8a878,
            #9a5635
        );
    border:2px solid #542d1d;
}

.keeper-body{
    position:absolute;
    width:80px;
    height:120px;
    top:48px;
    left:50%;
    transform:translateX(-50%);
    border-radius:28px 28px 15px 15px;
    background:
        linear-gradient(
            90deg,
            #08101b,
            #243a55,
            #08101b
        );
    border:3px solid #d8a900;
}

.keeper-body::after{
    content:"GK";
    position:absolute;
    left:50%;
    top:45px;
    transform:translateX(-50%);
    font-size:22px;
    font-weight:900;
    color:white;
}

.arm{
    position:absolute;
    width:27px;
    height:115px;
    top:55px;
    border-radius:20px;
    background:linear-gradient(
        90deg,
        #07101b,
        #263d58,
        #07101b
    );
    transform-origin:top center;
}

.arm.left{
    left:5px;
    transform:rotate(25deg);
}

.arm.right{
    right:5px;
    transform:rotate(-25deg);
}

.leg{
    position:absolute;
    width:30px;
    height:80px;
    top:160px;
    background:#101a26;
    border-radius:15px;
}

.leg.left{
    left:36px;
}

.leg.right{
    right:36px;
}

/* =========================
   GLOVES
========================= */

.glove{
    position:absolute;
    width:58px;
    height:58px;
    border-radius:50%;
    z-index:45;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff,
            #bfcbd5 60%,
            #66717b
        );

    border:4px solid #1260b5;

    transform:translate(-50%,-50%);

    box-shadow:
        0 5px 15px rgba(0,0,0,.7);

    cursor:pointer;

    transition:
        left .12s,
        top .12s,
        transform .35s;
}

.glove::after{
    content:"🧤";
    position:absolute;
    font-size:30px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

/* =========================
   PLAYER
========================= */

.player{
    position:absolute;
    width:125px;
    height:260px;
    left:50%;
    bottom:-145px;
    transform:translateX(-50%);
    z-index:25;
}

.player-head{
    position:absolute;
    width:43px;
    height:43px;
    left:50%;
    top:0;
    transform:translateX(-50%);
    border-radius:50%;
    background:
        radial-gradient(
            circle at 35% 30%,
            #e4a173,
            #8e4e30
        );
}

.player-body{
    position:absolute;
    width:70px;
    height:105px;
    left:50%;
    top:42px;
    transform:translateX(-50%);
    background:
        linear-gradient(
            90deg,
            #7c1119,
            #d61f2c,
            #7c1119
        );
    border-radius:22px;
}

.player-shorts{
    position:absolute;
    width:65px;
    height:55px;
    left:50%;
    top:137px;
    transform:translateX(-50%);
    background:#eeeeee;
    border-radius:8px;
}

.player-leg{
    position:absolute;
    width:24px;
    height:90px;
    top:180px;
    background:#d99465;
    border-radius:12px;
}

.player-leg.left{
    left:38px;
}

.player-leg.right{
    right:38px;
}

.player-foot{
    position:absolute;
    width:48px;
    height:20px;
    background:#111;
    border-radius:15px;
    top:255px;
}

.player-foot.left{
    left:20px;
}

.player-foot.right{
    right:20px;
}

/* =========================
   BALL
========================= */

.ball{
    position:absolute;
    width:43px;
    height:43px;
    left:50%;
    bottom:5%;
    transform:translateX(-50%);
    z-index:50;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff,
            #d9d9d9 60%,
            #777
        );

    box-shadow:
        0 5px 10px rgba(0,0,0,.6);

    transition:none;
}

.ball::after{
    content:"⚽";
    position:absolute;
    font-size:38px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

/* =========================
   UI
========================= */

.top{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:85px;
    z-index:100;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 25px;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.7),
            transparent
        );
}

.title{
    color:white;
    font-size:25px;
    font-weight:900;
}

.score{
    background:rgba(0,0,0,.5);
    padding:12px 18px;
    border-radius:15px;
    color:white;
    font-weight:bold;
}

/* =========================
   CONTROL BAR
========================= */

.controls{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:105px;

    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.9),
            rgba(0,0,0,.4)
        );

    padding:15px;
}

button{
    border:0;
    border-radius:14px;
    padding:15px 28px;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
}

.shoot{
    background:#e8b900;
    color:#111;
    min-width:180px;
}

.keeperBtn{
    background:#1769c2;
    color:white;
    min-width:180px;
}

.reset{
    background:#444;
    color:white;
}

/* =========================
   MESSAGE
========================= */

.message{
    position:absolute;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
    z-index:200;

    color:white;

    font-size:
        clamp(45px,9vw,100px);

    font-weight:1000;

    text-shadow:
        0 7px 20px rgba(0,0,0,.8);

    opacity:0;
    pointer-events:none;
}

.message.show{
    animation:result .9s ease forwards;
}

@keyframes result{
    0%{
        opacity:0;
        transform:
            translate(-50%,-40%)
            scale(.5);
    }

    30%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.15);
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-60%)
            scale(1);
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .top{
        height:65px;
        padding:0 12px;
    }

    .title{
        font-size:18px;
    }

    .score{
        font-size:12px;
        padding:9px 10px;
    }

    .goal{
        width:94%;
        height:52%;
        top:13%;
    }

    .keeper{
        transform:
            translateX(-50%)
            scale(.75);
        transform-origin:bottom center;
    }

    .player{
        transform:
            translateX(-50%)
            scale(.75);
        transform-origin:bottom center;
    }

    .glove{
        width:52px;
        height:52px;
    }

    .controls{
        height:105px;
        padding:10px;
    }

    button{
        font-size:14px;
        padding:13px 10px;
    }

    .shoot,
    .keeperBtn{
        min-width:0;
        flex:1;
    }

    .reset{
        width:48px;
        padding:10px;
    }
}
</style>
</head>

<body>

<div class="game">

<div class="camera" id="camera">

<div class="stadium">

    <div class="lights"></div>
    <div class="crowd"></div>
    <div class="field"></div>

</div>

<!-- TOP -->

<div class="top">

    <div class="title">
        ⚽ PENALTY
    </div>

    <div class="score">
        ⚽ <span id="goals">0</span>
        &nbsp; -
        &nbsp; 🧤 <span id="saves">0</span>
        &nbsp;&nbsp;
        <span id="round">1</span>/5
    </div>

</div>


<!-- GOAL -->

<div class="goal">

<div class="goal-depth">

<div class="net">

<div class="post left"></div>
<div class="post right"></div>
<div class="post top"></div>

</div>


<!-- TARGET -->

<div class="target" id="target"></div>

<div class="crosshair" id="crosshair"></div>


<!-- KEEPER -->

<div class="keeper" id="keeper">

    <div class="keeper-head"></div>

    <div class="keeper-body"></div>

    <div class="arm left"></div>
    <div class="arm right"></div>

    <div class="leg left"></div>
    <div class="leg right"></div>

</div>


<!-- GLOVE -->

<div
    class="glove"
    id="glove">
</div>


<!-- BALL -->

<div
    class="ball"
    id="ball">
</div>


<!-- PLAYER -->

<div class="player">

    <div class="player-head"></div>

    <div class="player-body"></div>

    <div class="player-shorts"></div>

    <div class="player-leg left"></div>
    <div class="player-leg right"></div>

    <div class="player-foot left"></div>
    <div class="player-foot right"></div>

</div>

</div>
</div>


<!-- RESULT -->

<div
    class="message"
    id="message">
</div>


<!-- CONTROLS -->

<div class="controls">

<button
    class="keeperBtn"
    id="keeperBtn">
    🧤 وضع الحارس
</button>

<button
    class="shoot"
    id="shootBtn">
    ⚽ تسديد
</button>

<button
    class="reset"
    id="resetBtn">
    ↻
</button>

</div>

</div>


<script>

/* ==========================================
   VARIABLES
========================================== */

const target =
    document.getElementById("target");

const crosshair =
    document.getElementById("crosshair");

const glove =
    document.getElementById("glove");

const keeper =
    document.getElementById("keeper");

const ball =
    document.getElementById("ball");

const camera =
    document.getElementById("camera");

const shootBtn =
    document.getElementById("shootBtn");

const keeperBtn =
    document.getElementById("keeperBtn");

const resetBtn =
    document.getElementById("resetBtn");

const message =
    document.getElementById("message");

let shot = {
    x:null,
    y:null
};

let glovePos = {
    x:50,
    y:55
};

let mode = "shot";

let goals = 0;
let saves = 0;
let round = 1;

let shooting = false;


/* ==========================================
   POSITION
========================================== */

function getPosition(e){

    const rect =
        target.getBoundingClientRect();

    let x;
    let y;

    if(e.touches){

        x =
            e.touches[0].clientX;

        y =
            e.touches[0].clientY;

    }else{

        x = e.clientX;
        y = e.clientY;

    }

    let px =
        ((x - rect.left) /
        rect.width) * 100;

    let py =
        ((y - rect.top) /
        rect.height) * 100;

    px =
        Math.max(
            5,
            Math.min(95,px)
        );

    py =
        Math.max(
            5,
            Math.min(92,py)
        );

    return {
        x:px,
        y:py
    };
}


/* ==========================================
   TARGET TOUCH
========================================== */

target.addEventListener(
    "pointerdown",
    function(e){

        if(shooting)
            return;

        const pos =
            getPosition(e);

        if(mode === "shot"){

            shot.x =
                pos.x;

            shot.y =
                pos.y;

            crosshair.style.left =
                pos.x + "%";

            crosshair.style.top =
                pos.y + "%";

            crosshair.style.display =
                "block";

        }else{

            moveGlove(
                pos.x,
                pos.y
            );

        }

    }
);


/* ==========================================
   MOVE GLOVE
========================================== */

function moveGlove(x,y){

    glovePos.x = x;
    glovePos.y = y;

    glove.style.left =
        x + "%";

    glove.style.top =
        y + "%";

    keeper.style.left =
        x + "%";

    if(x < 35){

        keeper.style.transform =
            "translateX(-50%) rotate(-15deg)";

    }else if(x > 65){

        keeper.style.transform =
            "translateX(-50%) rotate(15deg)";

    }else{

        keeper.style.transform =
            "translateX(-50%)";

    }
}


/* ==========================================
   MODE
========================================== */

keeperBtn.addEventListener(
    "click",
    function(){

        if(shooting)
            return;

        if(mode === "shot"){

            mode = "keeper";

            keeperBtn.textContent =
                "🎯 اختر التسديدة";

            keeperBtn.style.background =
                "#159447";

        }else{

            mode = "shot";

            keeperBtn.textContent =
                "🧤 وضع الحارس";

            keeperBtn.style.background =
                "#1769c2";

        }

    }
);


/* ==========================================
   MESSAGE
========================================== */

function result(text){

    message.textContent =
        text;

    message.classList.remove(
        "show"
    );

    void message.offsetWidth;

    message.classList.add(
        "show"
    );
}


/* ==========================================
   SHOOT
========================================== */

shootBtn.addEventListener(
    "click",
    shoot
);


function shoot(){

    if(shooting)
        return;

    if(
        shot.x === null ||
        shot.y === null
    ){

        result(
            "حدد مكان التسديدة"
        );

        return;
    }

    shooting = true;

    mode = "shot";

    keeperBtn.textContent =
        "🧤 وضع الحارس";

    keeperBtn.style.background =
        "#1769c2";


    /*
       المسافة بين القفاز والكرة
    */

    const dx =
        shot.x -
        glovePos.x;

    const dy =
        shot.y -
        glovePos.y;

    const distance =
        Math.sqrt(
            dx*dx +
            dy*dy
        );


    /*
       حركة الحارس وقت التسديدة
    */

    keeper.style.transition =
        "left .32s cubic-bezier(.15,.8,.2,1), transform .32s";

    keeper.style.left =
        glovePos.x + "%";


    if(shot.x < 35){

        keeper.style.transform =
            "translateX(-50%) rotate(-35deg)";

    }else if(shot.x > 65){

        keeper.style.transform =
            "translateX(-50%) rotate(35deg)";

    }else{

        keeper.style.transform =
            "translateX(-50%) translateY(-10px)";

    }


    /*
       حركة الكرة
    */

    const startX = 50;
    const startY = 90;

    const endX = shot.x;
    const endY = shot.y;

    const startTime =
        performance.now();

    const duration =
        650;


    function animateBall(now){

        let progress =
            (now - startTime) /
            duration;

        progress =
            Math.min(1,progress);


        /*
           منحنى واقعي للكرة
        */

        let ease =
            1 -
            Math.pow(
                1-progress,
                3
            );


        let x =
            startX +
            (endX-startX) *
            ease;


        let y =
            startY +
            (endY-startY) *
            ease;


        /*
           ارتفاع الكرة
        */

        let arc =
            Math.sin(
                progress *
                Math.PI
            ) * 18;


        ball.style.left =
            x + "%";

        ball.style.top =
            (y-arc) + "%";

        ball.style.bottom =
            "auto";


        let scale =
            1 -
            progress*.55;

        ball.style.transform =
            "translate(-50%,-50%) scale(" +
            scale +
            ")";


        if(progress < 1){

            requestAnimationFrame(
                animateBall
            );

        }

    }

    requestAnimationFrame(
        animateBall
    );


    /*
       تحديد النتيجة
    */

    setTimeout(
        function(){

            /*
               منطقة التصدي أصغر
               لجعل اللعبة أصعب
            */

            const saveDistance =
                distance;

            if(saveDistance < 15){

                saves++;

                result(
                    "🧤 تصدي!"
                );

                camera.classList.add(
                    "shake"
                );

                glove.style.transform =
                    "translate(-50%,-50%) scale(1.35)";

            }else{

                goals++;

                result(
                    "⚽ GOAL!"
                );

                camera.classList.add(
                    "shake"
                );

            }

            document.getElementById(
                "goals"
            ).textContent =
                goals;

            document.getElementById(
                "saves"
            ).textContent =
                saves;

        },
        670
    );


    /*
       الجولة القادمة
    */

    setTimeout(
        function(){

            round++;

            if(round > 5){

                setTimeout(
                    function(){

                        result(
                            "🏆 انتهت المباراة"
                        );

                    },
                    200
                );

                setTimeout(
                    resetGame,
                    1800
                );

            }else{

                document.getElementById(
                    "round"
                ).textContent =
                    round;

                resetRound();

            }

        },
        1600
    );

}


/* ==========================================
   RESET ROUND
========================================== */

function resetRound(){

    shooting = false;

    shot.x = null;
    shot.y = null;

    crosshair.style.display =
        "none";

    ball.style.left =
        "50%";

    ball.style.top =
        "auto";

    ball.style.bottom =
        "5%";

    ball.style.transform =
        "translateX(-50%)";

    glove.style.transform =
        "translate(-50%,-50%)";

    moveGlove(
        50,
        55
    );

    camera.classList.remove(
        "shake"
    );

}


/* ==========================================
   RESET GAME
========================================== */

function resetGame(){

    goals = 0;
    saves = 0;
    round = 1;

    document.getElementById(
        "goals"
    ).textContent = 0;

    document.getElementById(
        "saves"
    ).textContent = 0;

    document.getElementById(
        "round"
    ).textContent = 1;

    resetRound();

}


/* ==========================================
   RESET BUTTON
========================================== */

resetBtn.addEventListener(
    "click",
    resetGame
);


/* ==========================================
   INITIAL POSITION
========================================== */

moveGlove(
    50,
    55
);

</script>

</body>
</html>
