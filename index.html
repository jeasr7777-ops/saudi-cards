<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">
<title>تحدي الوقت</title>
<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
body {
    margin: 0;
    min-height: 100vh;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    color: white;
    background:
        radial-gradient(
            circle at top,
            #26344d 0%,
            #111827 40%,
            #06080d 100%
        );
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}
.game {
    width: 100%;
    max-width: 650px;
    min-height: 100vh;
    padding: 25px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}
/* العنوان */
.logo {
    font-size: 34px;
    font-weight: 900;
    text-align: center;
    margin-bottom: 5px;
}
.subtitle {
    color: #9ca8bb;
    font-size: 14px;
    text-align: center;
    margin-bottom: 25px;
}
/* الجولة */
.round-box {
    width: 100%;
    max-width: 420px;
    padding: 15px;
    border-radius: 18px;
    text-align: center;
    background:
        rgba(255,255,255,0.06);
    border:
        1px solid rgba(255,255,255,0.08);
    margin-bottom: 18px;
}
.round-title {
    color: #9da8bb;
    font-size: 14px;
    margin-bottom: 4px;
}
.round-number {
    font-size: 21px;
    font-weight: 900;
}
/* الهدف */
.target {
    text-align: center;
    margin-bottom: 10px;
}
.target-label {
    color: #9da8bb;
    font-size: 14px;
}
.target-time {
    font-size: 26px;
    font-weight: 900;
    margin-top: 3px;
}
/* العداد */
.timer-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 8px 0 22px;
}
.timer {
    width: 280px;
    height: 280px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    background:
        radial-gradient(
            circle,
            #101722 58%,
            transparent 59%
        ),
        conic-gradient(
            #ff3030 0deg,
            #252d3b 0deg
        );
    box-shadow:
        0 0 45px rgba(255,48,48,.14),
        inset 0 0 35px rgba(0,0,0,.5);
    transition: .15s;
}
.timer::before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border:
        1px solid rgba(255,255,255,.08);
}
.time {
    font-size: 55px;
    font-weight: 900;
    letter-spacing: 1px;
    z-index: 2;
}
/* الحالة */
.status {
    min-height: 24px;
    color: #aeb8c9;
    font-size: 14px;
    text-align: center;
    margin-bottom: 14px;
}
/* الزر الأحمر */
.button {
    width: 100%;
    max-width: 400px;
    height: 80px;
    border: none;
    border-radius: 23px;
    background:
        linear-gradient(
            145deg,
            #ff4545,
            #d60000
        );
    color: white;
    font-size: 25px;
    font-weight: 900;
    box-shadow:
        0 12px 30px
        rgba(220,0,0,.30),
        inset 0 2px 0
        rgba(255,255,255,.20);
    cursor: pointer;
    touch-action: manipulation;
    transition: .12s;
}
.button:active {
    transform: scale(.96);
    box-shadow:
        0 5px 15px
        rgba(220,0,0,.25),
        inset 0 2px 0
        rgba(255,255,255,.15);
}
.button.disabled {
    opacity: .55;
    pointer-events: none;
}
/* المعلومات */
.info {
    color: #68758a;
    font-size: 12px;
    text-align: center;
    margin-top: 13px;
}
/* النافذة */
.overlay {
    position: fixed;
    inset: 0;
    background:
        rgba(4,7,12,.90);
    backdrop-filter:
        blur(12px);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 100;
}
.overlay.show {
    display: flex;
}
.modal {
    width: 100%;
    max-width: 430px;
    background: #111824;
    border:
        1px solid
        rgba(255,255,255,.10);
    border-radius: 25px;
    padding: 30px;
    text-align: center;
    box-shadow:
        0 25px 80px
        rgba(0,0,0,.55);
}
.modal-icon {
    font-size: 60px;
    margin-bottom: 8px;
}
.modal h2 {
    margin: 5px 0 10px;
    font-size: 29px;
}
.modal p {
    color: #9da8b9;
    line-height: 1.7;
    margin-bottom: 20px;
}
.modal-button {
    width: 100%;
    height: 56px;
    border: none;
    border-radius: 16px;
    background: #ff3030;
    color: white;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
}
/* الجوال */
@media (max-width: 500px) {
    .game {
        padding: 18px 15px;
    }
    .logo {
        font-size: 30px;
    }
    .timer {
        width: 245px;
        height: 245px;
    }
    .time {
        font-size: 47px;
    }
    .button {
        height: 72px;
        font-size: 22px;
    }
}
</style>
</head>
<body>
<div class="game">
    <div class="logo">
        ⏱️ تحدي الوقت
    </div>
    <div class="subtitle">
        توقف قبل انتهاء الوقت
    </div>
    <!-- الجولة -->
    <div class="round-box">
        <div class="round-title">
            الجولة
        </div>
        <div
            class="round-number"
            id="roundText">
            1 من 3
        </div>
    </div>
    <!-- الهدف -->
    <div class="target">
        <div class="target-label">
            الهدف
        </div>
        <div
            class="target-time"
            id="targetText">
            5.00 ثانية
        </div>
    </div>
    <!-- العداد -->
    <div class="timer-container">
        <div
            class="timer"
            id="timerCircle">
            <div
                class="time"
                id="timeDisplay">
                0.00
            </div>
        </div>
    </div>
    <!-- الحالة -->
    <div
        class="status"
        id="status">
        اضغط للبدء
    </div>
    <!-- الزر -->
    <button
        class="button"
        id="mainButton">
        ابدأ
    </button>
    <div class="info">
        اضغط مرة للبدء واضغط مرة ثانية للإيقاف
    </div>
</div>
<!-- نافذة الخسارة -->
<div
    class="overlay"
    id="lossOverlay">
    <div class="modal">
        <div
            class="modal-icon">
            ❌
        </div>
        <h2>
            خسارة
        </h2>
        <p id="lossText">
            تجاوزت الوقت المحدد.
        </p>
        <button
            class="modal-button"
            id="nextButton">
            الجولة التالية
        </button>
    </div>
</div>
<!-- نافذة النهاية -->
<div
    class="overlay"
    id="endOverlay">
    <div class="modal">
        <div
            class="modal-icon">
            🎉
        </div>
        <h2>
            انتهت اللعبة
        </h2>
        <p>
            انتهيت من جميع الجولات.
        </p>
        <button
            class="modal-button"
            id="restartButton">
            🔄 إعادة اللعب
        </button>
    </div>
</div>
<script>
/*
========================================
الجولات
========================================
*/
const targets = [
    5,
    8,
    10
];
/*
========================================
متغيرات
========================================
*/
let round = 0;
let currentTime = 0;
let running = false;
let startTimestamp = 0;
let animationFrame = null;
/*
========================================
العناصر
========================================
*/
const timeDisplay =
    document.getElementById(
        "timeDisplay"
    );
const targetText =
    document.getElementById(
        "targetText"
    );
const roundText =
    document.getElementById(
        "roundText"
    );
const status =
    document.getElementById(
        "status"
    );
const mainButton =
    document.getElementById(
        "mainButton"
    );
const timerCircle =
    document.getElementById(
        "timerCircle"
    );
const lossOverlay =
    document.getElementById(
        "lossOverlay"
    );
const lossText =
    document.getElementById(
        "lossText"
    );
const nextButton =
    document.getElementById(
        "nextButton"
    );
const endOverlay =
    document.getElementById(
        "endOverlay"
    );
const restartButton =
    document.getElementById(
        "restartButton"
    );
/*
========================================
تحديث الواجهة
========================================
*/
function updateUI() {
    const target =
        targets[round];
    roundText.textContent =
        (round + 1)
        + " من 3";
    targetText.textContent =
        target.toFixed(2)
        + " ثانية";
    timeDisplay.textContent =
        currentTime.toFixed(2);
}
/*
========================================
إرجاع دائرة العداد
========================================
*/
function resetCircle() {
    timerCircle.style.background =
        `radial-gradient(
            circle,
            #101722 58%,
            transparent 59%
        ),
        conic-gradient(
            #ff3030 0deg,
            #252d3b 0deg
        )`;
}
/*
========================================
تحديث العداد
========================================
*/
function updateTimer() {
    if (!running) {
        return;
    }
    const now =
        performance.now();
    /*
    يبدأ من الرقم الذي توقفنا عنده
    */
    currentTime =
        (
            now
            -
            startTimestamp
        ) / 1000;
    timeDisplay.textContent =
        currentTime.toFixed(2);
    /*
    حركة الدائرة
    */
    const target =
        targets[round];
    const percent =
        Math.min(
            currentTime / target,
            1
        );
    const degrees =
        percent * 360;
    timerCircle.style.background =
        `radial-gradient(
            circle,
            #101722 58%,
            transparent 59%
        ),
        conic-gradient(
            #ff3030 ${degrees}deg,
            #252d3b ${degrees}deg
        )`;
    /*
    إذا وصل أو تجاوز الهدف
    */
    if (
        currentTime >= target
    ) {
        currentTime =
            target;
        timeDisplay.textContent =
            target.toFixed(2);
        stopTimer();
        loseRound();
        return;
    }
    animationFrame =
        requestAnimationFrame(
            updateTimer
        );
}
/*
========================================
بدء العداد
========================================
*/
function startTimer() {
    if (running) {
        return;
    }
    running = true;
    /*
    أهم نقطة:
    يكمل من نفس الرقم
    */
    startTimestamp =
        performance.now()
        -
        (
            currentTime * 1000
        );
    mainButton.textContent =
        "إيقاف";
    status.textContent =
        "الوقت يعمل... اضغط للإيقاف";
    animationFrame =
        requestAnimationFrame(
            updateTimer
        );
}
/*
========================================
إيقاف العداد
========================================
*/
function stopTimer() {
    running = false;
    if (
        animationFrame
    ) {
        cancelAnimationFrame(
            animationFrame
        );
        animationFrame = null;
    }
    mainButton.textContent =
        "استمر";
}
/*
========================================
ضغط المستخدم للإيقاف
========================================
*/
function stopByUser() {
    stopTimer();
    const target =
        targets[round];
    if (
        currentTime < target
    ) {
        status.textContent =
            "توقف عند "
            +
            currentTime.toFixed(2)
            +
            " ثانية";
    }
}
/*
========================================
خسارة الجولة
========================================
*/
function loseRound() {
    mainButton.classList.add(
        "disabled"
    );
    status.textContent =
        "انتهى الوقت";
    lossText.innerHTML =
        "وصلت إلى "
        +
        "<strong>"
        +
        targets[round].toFixed(2)
        +
        "</strong>"
        +
        " ثانية.";
    /*
    الجولة الثالثة
    */
    if (
        round === 2
    ) {
        nextButton.textContent =
            "إنهاء اللعبة";
    }
    else {
        nextButton.textContent =
            "الجولة التالية";
    }
    lossOverlay.classList.add(
        "show"
    );
}
/*
========================================
زر اللعبة الرئيسي
========================================
*/
mainButton.addEventListener(
    "click",
    function() {
        if (
            mainButton.classList.contains(
                "disabled"
            )
        ) {
            return;
        }
        if (running) {
            stopByUser();
        }
        else {
            startTimer();
        }
    }
);
/*
========================================
الجولة التالية
========================================
*/
nextButton.addEventListener(
    "click",
    function() {
        lossOverlay.classList.remove(
            "show"
        );
        /*
        إذا كانت الجولة الثالثة
        */
        if (
            round === 2
        ) {
            endOverlay.classList.add(
                "show"
            );
            return;
        }
        /*
        الانتقال للجولة التالية
        */
        round++;
        /*
        تصفير العداد
        */
        currentTime = 0;
        running = false;
        if (
            animationFrame
        ) {
            cancelAnimationFrame(
                animationFrame
            );
            animationFrame = null;
        }
        mainButton.classList.remove(
            "disabled"
        );
        mainButton.textContent =
            "ابدأ";
        status.textContent =
            "اضغط للبدء";
        resetCircle();
        updateUI();
    }
);
/*
========================================
إعادة اللعب
========================================
*/
restartButton.addEventListener(
    "click",
    function() {
        endOverlay.classList.remove(
            "show"
        );
        round = 0;
        currentTime = 0;
        running = false;
        if (
            animationFrame
        ) {
            cancelAnimationFrame(
                animationFrame
            );
            animationFrame = null;
        }
        mainButton.classList.remove(
            "disabled"
        );
        mainButton.textContent =
            "ابدأ";
        status.textContent =
            "اضغط للبدء";
        resetCircle();
        updateUI();
    }
);
/*
========================================
تشغيل اللعبة
========================================
*/
updateUI();
resetCircle();
</script>
</body>
</html>
