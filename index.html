<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Penalty Challenge</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #071b12;
    color: white;
    touch-action: none;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: 100%;
    max-width: 1100px;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 30%, #168449 0%, #086331 35%, #04351d 100%);
}

/* العنوان */
.topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    z-index: 20;
    background: linear-gradient(to bottom, rgba(0,0,0,.45), transparent);
}

.logo {
    font-size: 24px;
    font-weight: 900;
}

.score {
    background: rgba(0,0,0,.35);
    padding: 10px 18px;
    border-radius: 15px;
    font-weight: bold;
}

/* الملعب */
.pitch {
    position: absolute;
    top: 75px;
    bottom: 120px;
    left: 0;
    right: 0;
    overflow: hidden;
}

/* خطوط الملعب */
.pitch::before {
    content: "";
    position: absolute;
    left: 5%;
    right: 5%;
    bottom: 0;
    height: 55%;
    border: 3px solid rgba(255,255,255,.45);
    border-bottom: none;
    border-radius: 10px 10px 0 0;
}

.goal {
    position: absolute;
    width: min(82%, 820px);
    height: min(46vw, 410px);
    max-height: 410px;
    min-height: 260px;
    top: 5%;
    left: 50%;
    transform: translateX(-50%);
    perspective: 800px;
}

/* شبكة المرمى */
.net {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(rgba(255,255,255,.22) 2px, transparent 2px),
        linear-gradient(90deg, rgba(255,255,255,.22) 2px, transparent 2px);
    background-size: 35px 35px;
    border: 8px solid white;
    border-bottom-width: 12px;
    box-shadow:
        0 0 0 4px rgba(0,0,0,.25),
        0 15px 40px rgba(0,0,0,.4);
    overflow: hidden;
}

/* القائم */
.post {
    position: absolute;
    background: white;
    box-shadow: 0 3px 8px rgba(0,0,0,.3);
    z-index: 8;
}

.post.left {
    width: 10px;
    height: 100%;
    left: -5px;
}

.post.right {
    width: 10px;
    height: 100%;
    right: -5px;
}

.post.top {
    height: 10px;
    width: 100%;
    top: -5px;
}

/* منطقة التصويب */
.target-zone {
    position: absolute;
    inset: 0;
    z-index: 5;
    cursor: crosshair;
}

/* الحارس */
.keeper {
    position: absolute;
    width: 115px;
    height: 190px;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    transition: left .55s cubic-bezier(.2,.8,.2,1),
                transform .55s cubic-bezier(.2,.8,.2,1);
    z-index: 12;
    pointer-events: none;
}

.head {
    position: absolute;
    width: 46px;
    height: 46px;
    background: #c98255;
    border-radius: 50%;
    left: 50%;
    top: 5px;
    transform: translateX(-50%);
    border: 3px solid #552d1c;
}

.body {
    position: absolute;
    width: 75px;
    height: 100px;
    background: #111827;
    left: 50%;
    top: 48px;
    transform: translateX(-50%);
    border-radius: 25px 25px 12px 12px;
    border: 3px solid #f1c40f;
}

.arm {
    position: absolute;
    width: 22px;
    height: 105px;
    background: #111827;
    top: 52px;
    border-radius: 15px;
    border: 3px solid #f1c40f;
}

.arm.left {
    left: 5px;
    transform: rotate(22deg);
}

.arm.right {
    right: 5px;
    transform: rotate(-22deg);
}

.leg {
    position: absolute;
    width: 28px;
    height: 65px;
    background: #111827;
    top: 135px;
    border-radius: 10px;
}

.leg.left {
    left: 25px;
}

.leg.right {
    right: 25px;
}

.glove {
    position: absolute;
    width: 48px;
    height: 48px;
    background: #e9f2ff;
    border: 4px solid #2563eb;
    border-radius: 50%;
    z-index: 20;
    transition: left .15s ease, top .15s ease;
    transform: translate(-50%, -50%);
    box-shadow: 0 4px 10px rgba(0,0,0,.4);
}

/* الكرة */
.ball {
    position: absolute;
    width: 38px;
    height: 38px;
    background: white;
    border-radius: 50%;
    border: 3px solid #111;
    left: 50%;
    bottom: 8%;
    transform: translateX(-50%);
    z-index: 15;
    transition:
        left .7s cubic-bezier(.2,.8,.2,1),
        top .7s cubic-bezier(.2,.8,.2,1),
        transform .7s ease;
}

.ball::before {
    content: "⚽";
    position: absolute;
    font-size: 34px;
    left: -1px;
    top: -4px;
}

/* نقطة التصويب */
.aim {
    position: absolute;
    width: 35px;
    height: 35px;
    border: 3px solid #ffdf00;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 25;
    display: none;
    box-shadow: 0 0 15px rgba(255,223,0,.8);
}

.aim::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    background: #ffdf00;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

/* لوحة التحكم */
.controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 120px;
    background: rgba(0,0,0,.45);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    z-index: 30;
    padding: 15px;
}

button {
    border: none;
    border-radius: 14px;
    padding: 15px 30px;
    font-size: 18px;
    font-weight: bold;
    color: white;
    cursor: pointer;
}

.shoot {
    background: #eab308;
    color: #111;
    min-width: 170px;
}

.save {
    background: #2563eb;
    min-width: 170px;
}

.reset {
    background: #444;
}

/* الرسالة */
.message {
    position: absolute;
    left: 50%;
    top: 48%;
    transform: translate(-50%, -50%);
    z-index: 50;
    font-size: clamp(35px, 7vw, 80px);
    font-weight: 900;
    text-shadow: 0 5px 15px rgba(0,0,0,.7);
    opacity: 0;
    pointer-events: none;
}

.message.show {
    animation: message .9s ease forwards;
}

@keyframes message {
    0% {
        opacity: 0;
        transform: translate(-50%, -40%) scale(.6);
    }
    30% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.15);
    }
    100% {
        opacity: 0;
        transform: translate(-50%, -60%) scale(1);
    }
}

/* تعليمات */
.help {
    position: absolute;
    top: 82px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    background: rgba(0,0,0,.45);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    white-space: nowrap;
}

/* للجوال والآيباد */
@media (max-width: 700px) {
    .topbar {
        height: 60px;
        padding: 0 12px;
    }

    .logo {
        font-size: 18px;
    }

    .score {
        font-size: 13px;
        padding: 8px 12px;
    }

    .pitch {
        top: 60px;
        bottom: 105px;
    }

    .goal {
        width: 92%;
        height: 48%;
        min-height: 230px;
        top: 8%;
    }

    .keeper {
        transform: translateX(-50%) scale(.8);
        transform-origin: bottom center;
    }

    .controls {
        height: 105px;
        gap: 8px;
    }

    button {
        padding: 13px 12px;
        font-size: 15px;
    }

    .shoot,
    .save {
        min-width: 0;
        flex: 1;
    }

    .reset {
        width: 55px;
        padding: 10px;
    }

    .help {
        top: 67px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="topbar">
        <div class="logo">⚽ PENALTY</div>
        <div class="score">
            الأهداف: <span id="goals">0</span>
            &nbsp;|&nbsp;
            التصديات: <span id="saves">0</span>
            &nbsp;|&nbsp;
            <span id="round">1</span>/5
        </div>
    </div>

    <div class="help">
        🎯 اضغط داخل المرمى لتحديد مكان التسديدة
    </div>

    <div class="pitch">

        <div class="goal">

            <div class="net">
                <div class="post left"></div>
                <div class="post right"></div>
                <div class="post top"></div>
            </div>

            <div class="target-zone" id="targetZone"></div>

            <div class="aim" id="aim"></div>

            <div class="keeper" id="keeper">
                <div class="head"></div>
                <div class="body"></div>
                <div class="arm left"></div>
                <div class="arm right"></div>
                <div class="leg left"></div>
                <div class="leg right"></div>
            </div>

            <div class="glove" id="glove">🧤</div>

            <div class="ball" id="ball"></div>

        </div>

    </div>

    <div class="message" id="message"></div>

    <div class="controls">
        <button class="save" id="saveBtn">🧤 اختر مكان الحارس</button>
        <button class="shoot" id="shootBtn">⚽ سدد</button>
        <button class="reset" id="resetBtn">↻</button>
    </div>

</div>

<script>

const goal = document.querySelector(".goal");
const targetZone = document.getElementById("targetZone");
const aim = document.getElementById("aim");
const glove = document.getElementById("glove");
const ball = document.getElementById("ball");
const keeper = document.getElementById("keeper");

const shootBtn = document.getElementById("shootBtn");
const saveBtn = document.getElementById("saveBtn");
const resetBtn = document.getElementById("resetBtn");

const message = document.getElementById("message");

const goalsText = document.getElementById("goals");
const savesText = document.getElementById("saves");
const roundText = document.getElementById("round");

let shotX = null;
let shotY = null;

let keeperX = 50;
let keeperY = 55;

let goals = 0;
let saves = 0;
let round = 1;

let selectingKeeper = false;
let shooting = false;


/* تحويل الضغط إلى نسبة داخل المرمى */
function getPosition(e) {

    const rect = goal.getBoundingClientRect();

    let clientX;
    let clientY;

    if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    } else {
        clientX = e.clientX;
        clientY = e.clientY;
    }

    let x = ((clientX - rect.left) / rect.width) * 100;
    let y = ((clientY - rect.top) / rect.height) * 100;

    x = Math.max(7, Math.min(93, x));
    y = Math.max(7, Math.min(90, y));

    return {x, y};
}


/* اختيار مكان التسديدة */
function chooseShot(e) {

    if (shooting || selectingKeeper) return;

    const pos = getPosition(e);

    shotX = pos.x;
    shotY = pos.y;

    aim.style.left = shotX + "%";
    aim.style.top = shotY + "%";
    aim.style.display = "block";
}


/* اختيار مكان القفاز */
function chooseKeeper(e) {

    if (shooting) return;

    const pos = getPosition(e);

    keeperX = pos.x;
    keeperY = pos.y;

    glove.style.left = keeperX + "%";
    glove.style.top = keeperY + "%";

    /* تحريك الحارس */
    keeper.style.left = keeperX + "%";

    /* حركة بسيطة حسب مكان القفاز */
    if (keeperX < 35) {
        keeper.style.transform =
            "translateX(-50%) rotate(-12deg)";
    } else if (keeperX > 65) {
        keeper.style.transform =
            "translateX(-50%) rotate(12deg)";
    } else {
        keeper.style.transform =
            "translateX(-50%)";
    }
}


/* الضغط داخل المرمى */
targetZone.addEventListener("pointerdown", function(e) {

    if (shooting) return;

    if (selectingKeeper) {
        chooseKeeper(e);
    } else {
        chooseShot(e);
    }
});


/* زر اختيار الحارس */
saveBtn.addEventListener("click", function() {

    if (shooting) return;

    selectingKeeper = !selectingKeeper;

    if (selectingKeeper) {

        saveBtn.textContent = "🧤 اضغط مكان القفاز";

        saveBtn.style.background = "#16a34a";

    } else {

        saveBtn.textContent = "🧤 اختر مكان الحارس";

        saveBtn.style.background = "#2563eb";
    }
});


/* إظهار النتيجة */
function showMessage(text) {

    message.textContent = text;

    message.classList.remove("show");

    void message.offsetWidth;

    message.classList.add("show");
}


/* تنفيذ التسديدة */
shootBtn.addEventListener("click", function() {

    if (shooting) return;

    if (shotX === null) {
        showMessage("🎯 اختر مكان التسديدة");
        return;
    }

    shooting = true;

    selectingKeeper = false;

    saveBtn.textContent = "🧤 اختر مكان الحارس";
    saveBtn.style.background = "#2563eb";

    /* حركة الحارس نحو المكان المختار */
    keeper.style.left = keeperX + "%";

    /* الكرة تطير */
    ball.style.left = shotX + "%";
    ball.style.top = shotY + "%";
    ball.style.bottom = "auto";

    ball.style.transform =
        "translate(-50%, -50%) scale(.65)";

    setTimeout(function() {

        /*
        حساب المسافة بين القفاز ومكان الكرة
        */
        const dx = shotX - keeperX;
        const dy = shotY - keeperY;

        const distance = Math.sqrt(dx * dx + dy * dy);

        /*
        إذا القفاز قريب من مكان التسديدة
        */
        if (distance < 13) {

            saves++;

            showMessage("🧤 تصدي!");

            /* حركة القفاز */
            glove.style.transform =
                "translate(-50%, -50%) scale(1.3) rotate(-20deg)";

        } else {

            goals++;

            showMessage("⚽ GOAL!");

            glove.style.transform =
                "translate(-50%, -50%) scale(1)";

        }

        goalsText.textContent = goals;
        savesText.textContent = saves;

    }, 650);


    /* إعادة الجولة */
    setTimeout(function() {

        round++;

        if (round > 5) {

            showMessage(
                "🏆 انتهت المباراة! " +
                goals + " أهداف"
            );

            round = 1;

            setTimeout(resetGame, 1800);

        } else {

            roundText.textContent = round;

            resetShot();

        }

    }, 1700);

});


/* إعادة الكرة */
function resetShot() {

    shooting = false;

    shotX = null;
    shotY = null;

    aim.style.display = "none";

    ball.style.left = "50%";
    ball.style.top = "auto";
    ball.style.bottom = "8%";

    ball.style.transform =
        "translateX(-50%)";

    /* يرجع الحارس للوسط */
    keeperX = 50;
    keeperY = 55;

    keeper.style.left = "50%";
    keeper.style.transform =
        "translateX(-50%)";

    glove.style.left = "50%";
    glove.style.top = "55%";

    glove.style.transform =
        "translate(-50%, -50%)";
}


/* إعادة اللعبة */
function resetGame() {

    goals = 0;
    saves = 0;
    round = 1;

    goalsText.textContent = "0";
    savesText.textContent = "0";
    roundText.textContent = "1";

    resetShot();
}


/* زر إعادة */
resetBtn.addEventListener("click", resetGame);


/* منع تكبير الآيباد باللمس المتكرر */
document.addEventListener("gesturestart", function(e) {
    e.preventDefault();
});

</script>

</body>
</html>
