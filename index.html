<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">
<title>تحدي الوقت</title>
<style>
/* =========================
   الأساس
========================= */
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
body {
    margin: 0;
    min-height: 100vh;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    color: white;
    background:
        radial-gradient(
            circle at top,
            #26344d 0%,
            #111827 40%,
            #06080d 100%
        );
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}
.game {
    width: 100%;
    max-width: 650px;
    min-height: 100vh;
    padding: 22px 18px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}
/* =========================
   العنوان
========================= */
.logo {
    font-size: 34px;
    font-weight: 900;
    text-align: center;
    margin-bottom: 5px;
}
.subtitle {
    color: #9ca8bb;
    font-size: 14px;
    text-align: center;
    margin-bottom: 22px;
}
/* =========================
   اختيار الوضع
========================= */
.mode-selection {
    width: 100%;
    max-width: 430px;
    margin-bottom: 15px;
}
.mode-title {
    text-align: center;
    color: #aab4c5;
    font-size: 14px;
    margin-bottom: 10px;
}
.mode-buttons {
    display: flex;
    gap: 10px;
}
.mode-button {
    flex: 1;
    min-height: 58px;
    border: 1px solid
        rgba(255,255,255,.10);
    border-radius: 17px;
    background:
        rgba(255,255,255,.06);
    color: white;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    touch-action: manipulation;
}
.mode-button.active {
    background:
        linear-gradient(
            145deg,
            #ff4545,
            #d60000
        );
    border-color: #ff3030;
    box-shadow:
        0 8px 25px
        rgba(255,48,48,.22);
}
/* =========================
   الجولة
========================= */
.round-box {
    width: 100%;
    max-width: 430px;
    padding: 14px;
    border-radius: 18px;
    text-align: center;
    background:
        rgba(255,255,255,.06);
    border:
        1px solid
        rgba(255,255,255,.08);
    margin-bottom: 13px;
}
.round-title {
    color: #9da8bb;
    font-size: 13px;
    margin-bottom: 3px;
}
.round-number {
    font-size: 21px;
    font-weight: 900;
}
/* =========================
   رسالة بداية الجولة
========================= */
.round-instruction {
    width: 100%;
    max-width: 430px;
    padding: 17px 15px;
    border-radius: 18px;
    text-align: center;
    background:
        linear-gradient(
            145deg,
            rgba(255,48,48,.16),
            rgba(255,255,255,.05)
        );
    border:
        1px solid
        rgba(255,70,70,.22);
    margin-bottom: 17px;
}
.warning {
    font-size: 20px;
    font-weight: 900;
    margin-bottom: 7px;
}
.instruction-text {
    color: #dce2eb;
    font-size: 16px;
    line-height: 1.7;
}
.instruction-time {
    color: #ff4b4b;
    font-size: 25px;
    font-weight: 900;
}
/* =========================
   الهدف أثناء وضع إظهار الوقت
========================= */
.target {
    text-align: center;
    margin-bottom: 8px;
}
.target-label {
    color: #9da8bb;
    font-size: 13px;
}
.target-time {
    font-size: 25px;
    font-weight: 900;
    margin-top: 2px;
}
/* =========================
   العداد
========================= */
.timer-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 5px 0 18px;
}
.timer {
    width: 275px;
    height: 275px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    background:
        radial-gradient(
            circle,
            #101722 58%,
            transparent 59%
        ),
        conic-gradient(
            #ff3030 0deg,
            #252d3b 0deg
        );
    box-shadow:
        0 0 45px
        rgba(255,48,48,.14),
        inset 0 0 35px
        rgba(0,0,0,.5);
}
.timer::before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border:
        1px solid
        rgba(255,255,255,.08);
}
.time {
    font-size: 54px;
    font-weight: 900;
    letter-spacing: 1px;
    z-index: 2;
}
/* =========================
   وضع إخفاء الوقت
========================= */
/*
بعد الضغط على ابدأ:
- يخفي العداد
- يخفي الهدف
- يخفي التعليمات
- يبقى رقم الجولة
- يبقى الزر الأحمر
*/
body.hidden-playing .timer-container {
    display: none;
}
body.hidden-playing .target {
    display: none;
}
body.hidden-playing .round-instruction {
    display: none;
}
/* =========================
   الحالة
========================= */
.status {
    min-height: 23px;
    color: #aeb8c9;
    font-size: 14px;
    text-align: center;
    margin-bottom: 13px;
}
/* =========================
   الزر الأحمر
========================= */
.button {
    width: 100%;
    max-width: 400px;
    height: 80px;
    border: none;
    border-radius: 23px;
    background:
        linear-gradient(
            145deg,
            #ff4545,
            #d60000
        );
    color: white;
    font-size: 25px;
    font-weight: 900;
    box-shadow:
        0 12px 30px
        rgba(220,0,0,.30),
        inset 0 2px 0
        rgba(255,255,255,.20);
    cursor: pointer;
    touch-action: manipulation;
    transition: .12s;
}
.button:active {
    transform: scale(.96);
}
.button.disabled {
    opacity: .55;
    pointer-events: none;
}
/* =========================
   المعلومات
========================= */
.info {
    color: #68758a;
    font-size: 12px;
    text-align: center;
    margin-top: 12px;
    line-height: 1.6;
}
/* =========================
   النوافذ
========================= */
.overlay {
    position: fixed;
    inset: 0;
    background:
        rgba(4,7,12,.91);
    backdrop-filter:
        blur(12px);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 100;
}
.overlay.show {
    display: flex;
}
.modal {
    width: 100%;
    max-width: 430px;
    background: #111824;
    border:
        1px solid
        rgba(255,255,255,.10);
    border-radius: 25px;
    padding: 30px;
    text-align: center;
    box-shadow:
        0 25px 80px
        rgba(0,0,0,.55);
}
.modal-icon {
    font-size: 58px;
    margin-bottom: 7px;
}
.modal h2 {
    margin: 5px 0 15px;
    font-size: 29px;
}
.modal p {
    color: #9da8b9;
    line-height: 1.9;
    margin-bottom: 20px;
    font-size: 16px;
}
.loss-time {
    color: #ff4545;
    font-size: 26px;
    font-weight: 900;
}
.target-result {
    color: white;
    font-weight: 800;
}
.difference {
    color: #ff8b8b;
    font-weight: 800;
}
.modal-button {
    width: 100%;
    height: 56px;
    border: none;
    border-radius: 16px;
    background:
        linear-gradient(
            145deg,
            #ff4545,
            #d60000
        );
    color: white;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
}
/* =========================
   إخفاء اختيار الوضع بعد بدء اللعبة
========================= */
.playing .mode-selection {
    display: none;
}
/* =========================
   الجوال
========================= */
@media (max-width: 500px) {
    .game {
        padding:
            18px 15px;
    }
    .logo {
        font-size: 30px;
    }
    .timer {
        width: 245px;
        height: 245px;
    }
    .time {
        font-size: 47px;
    }
    .button {
        height: 72px;
        font-size: 22px;
    }
}
</style>
</head>
<body>
<div class="game" id="game">
    <!-- العنوان -->
    <div class="logo">
        ⏱️ تحدي الوقت
    </div>
    <div class="subtitle">
        حاول الوصول للهدف بأكبر دقة
    </div>
    <!-- اختيار الوضع -->
    <div
        class="mode-selection"
        id="modeSelection">
        <div class="mode-title">
            اختر طريقة اللعب
        </div>
        <div class="mode-buttons">
            <button
                class="mode-button active"
                id="showMode">
                🕐 إظهار الوقت
            </button>
            <button
                class="mode-button"
                id="hideMode">
                🔴 إخفاء الوقت
            </button>
        </div>
    </div>
    <!-- الجولة -->
    <div class="round-box">
        <div class="round-title">
            الجولة
        </div>
        <div
            class="round-number"
            id="roundText">
            1 من 3
        </div>
    </div>
    <!-- تعليمات الجولة -->
    <div
        class="round-instruction"
        id="roundInstruction">
        <div class="warning">
            ⚠️ انتبه!
        </div>
        <div class="instruction-text">
            لازم توقف عند
            <br>
            <span
                class="instruction-time"
                id="instructionTime">
                5.00 ثانية
            </span>
        </div>
    </div>
    <!-- الهدف -->
    <div
        class="target"
        id="targetBox">
        <div class="target-label">
            الهدف
        </div>
        <div
            class="target-time"
            id="targetText">
            5.00 ثانية
        </div>
    </div>
    <!-- العداد -->
    <div
        class="timer-container"
        id="timerContainer">
        <div
            class="timer"
            id="timerCircle">
            <div
                class="time"
                id="timeDisplay">
                0.00
            </div>
        </div>
    </div>
    <!-- الحالة -->
    <div
        class="status"
        id="status">
        اضغط ابدأ لبدء الجولة
    </div>
    <!-- الزر -->
    <button
        class="button"
        id="mainButton">
        ابدأ
    </button>
    <div
        class="info"
        id="info">
        اختر الوضع ثم ابدأ الجولة
    </div>
</div>
<!-- =========================
     نافذة الخسارة
========================= -->
<div
    class="overlay"
    id="lossOverlay">
    <div class="modal">
        <div class="modal-icon">
            ❌
        </div>
        <h2>
            خسارة
        </h2>
        <p id="lossText"></p>
        <button
            class="modal-button"
            id="nextButton">
            الجولة التالية
        </button>
    </div>
</div>
<!-- =========================
     نهاية اللعبة
========================= -->
<div
    class="overlay"
    id="endOverlay">
    <div class="modal">
        <div class="modal-icon">
            🎉
        </div>
        <h2>
            انتهت اللعبة
        </h2>
        <p>
            انتهيت من جميع الجولات.
        </p>
        <button
            class="modal-button"
            id="restartButton">
            🔄 إعادة اللعب
        </button>
    </div>
</div>
<script>
/* =========================
   أهداف الجولات
========================= */
const targets = [
    5,
    8,
    10
];
/* =========================
   متغيرات اللعبة
========================= */
let round = 0;
let currentTime = 0;
let running = false;
let startTimestamp = 0;
let animationFrame = null;
let selectedMode = "show";
/* =========================
   العناصر
========================= */
const game =
    document.getElementById(
        "game"
    );
const showMode =
    document.getElementById(
        "showMode"
    );
const hideMode =
    document.getElementById(
        "hideMode"
    );
const roundText =
    document.getElementById(
        "roundText"
    );
const instructionTime =
    document.getElementById(
        "instructionTime"
    );
const targetText =
    document.getElementById(
        "targetText"
    );
const timeDisplay =
    document.getElementById(
        "timeDisplay"
    );
const timerCircle =
    document.getElementById(
        "timerCircle"
    );
const status =
    document.getElementById(
        "status"
    );
const mainButton =
    document.getElementById(
        "mainButton"
    );
const info =
    document.getElementById(
        "info"
    );
const roundInstruction =
    document.getElementById(
        "roundInstruction"
    );
const targetBox =
    document.getElementById(
        "targetBox"
    );
const lossOverlay =
    document.getElementById(
        "lossOverlay"
    );
const lossText =
    document.getElementById(
        "lossText"
    );
const nextButton =
    document.getElementById(
        "nextButton"
    );
const endOverlay =
    document.getElementById(
        "endOverlay"
    );
const restartButton =
    document.getElementById(
        "restartButton"
    );
/* =========================
   تحديث معلومات الجولة
========================= */
function updateRoundInfo() {
    const target =
        targets[round];
    roundText.textContent =
        (round + 1)
        + " من 3";
    instructionTime.textContent =
        target.toFixed(2)
        + " ثانية";
    targetText.textContent =
        target.toFixed(2)
        + " ثانية";
    timeDisplay.textContent =
        currentTime.toFixed(2);
}
/* =========================
   اختيار إظهار الوقت
========================= */
showMode.addEventListener(
    "click",
    function() {
        if (running) {
            return;
        }
        selectedMode = "show";
        document.body.classList.remove(
            "hidden-playing"
        );
        showMode.classList.add(
            "active"
        );
        hideMode.classList.remove(
            "active"
        );
        status.textContent =
            "اضغط ابدأ لبدء الجولة";
        info.textContent =
            "الوقت سيظهر أثناء اللعب";
    }
);
/* =========================
   اختيار إخفاء الوقت
========================= */
hideMode.addEventListener(
    "click",
    function() {
        if (running) {
            return;
        }
        selectedMode = "hide";
        document.body.classList.remove(
            "hidden-playing"
        );
        hideMode.classList.add(
            "active"
        );
        showMode.classList.remove(
            "active"
        );
        status.textContent =
            "اضغط ابدأ ثم اعتمد على إحساسك بالوقت";
        info.textContent =
            "بعد ابدأ سيختفي العداد";
    }
);
/* =========================
   إعادة شكل دائرة العداد
========================= */
function resetCircle() {
    timerCircle.style.background =
        `radial-gradient(
            circle,
            #101722 58%,
            transparent 59%
        ),
        conic-gradient(
            #ff3030 0deg,
            #252d3b 0deg
        )`;
}
/* =========================
   بدء الجولة
========================= */
function startTimer() {
    if (running) {
        return;
    }
    running = true;
    /*
    نكمل من الوقت السابق
    */
    startTimestamp =
        performance.now()
        -
        (
            currentTime * 1000
        );
    /*
    نخفي تعليمات الهدف أثناء اللعب
    */
    roundInstruction.style.display =
        "none";
    /*
    وضع إخفاء الوقت:
    نخفي العداد والهدف
    */
    if (
        selectedMode === "hide"
    ) {
        document.body.classList.add(
            "hidden-playing"
        );
    }
    game.classList.add(
        "playing"
    );
    mainButton.textContent =
        "إيقاف";
    if (
        selectedMode === "hide"
    ) {
        status.textContent =
            "اعتمد على إحساسك بالوقت";
    }
    else {
        status.textContent =
            "الوقت يعمل... اضغط للإيقاف";
    }
    animationFrame =
        requestAnimationFrame(
            updateTimer
        );
}
/* =========================
   تحديث الوقت
========================= */
function updateTimer() {
    if (!running) {
        return;
    }
    const now =
        performance.now();
    currentTime =
        (
            now -
            startTimestamp
        ) / 1000;
    /*
    يظهر الوقت فقط
    في وضع إظهار الوقت
    */
    if (
        selectedMode === "show"
    ) {
        timeDisplay.textContent =
            currentTime.toFixed(2);
    }
    /*
    دائرة التقدم
    */
    const target =
        targets[round];
    const percent =
        Math.min(
            currentTime / target,
            1
        );
    const degrees =
        percent * 360;
    timerCircle.style.background =
        `radial-gradient(
            circle,
            #101722 58%,
            transparent 59%
        ),
        conic-gradient(
            #ff3030 ${degrees}deg,
            #252d3b ${degrees}deg
        )`;
    /*
    إذا وصل للهدف أو تجاوزه
    */
    if (
        currentTime >= target
    ) {
        /*
        نحتفظ بالوقت الحقيقي
        مثال: 8.13
        */
        const actualTime =
            currentTime;
        stopTimer();
        loseRound(
            actualTime
        );
        return;
    }
    animationFrame =
        requestAnimationFrame(
            updateTimer
        );
}
/* =========================
   إيقاف العداد
========================= */
function stopTimer() {
    running = false;
    if (animationFrame) {
        cancelAnimationFrame(
            animationFrame
        );
        animationFrame = null;
    }
    mainButton.textContent =
        "استمر";
}
/* =========================
   إيقاف يدوي
========================= */
function stopByUser() {
    stopTimer();
    if (
        currentTime <
        targets[round]
    ) {
        status.textContent =
            "تم إيقاف الوقت عند "
            +
            currentTime.toFixed(2)
            +
            " ثانية";
    }
}
/* =========================
   الخسارة
========================= */
function loseRound(
    actualTime
) {
    mainButton.classList.add(
        "disabled"
    );
    const target =
        targets[round];
    const difference =
        actualTime - target;
    /*
    نظهر القيمة الدقيقة
    */
    lossText.innerHTML =
        `توقفت عند
        <span class="loss-time">
            ${actualTime.toFixed(2)} ثانية
        </span>
        <br>
        والهدف كان
        <span class="target-result">
            ${target.toFixed(2)} ثانية
        </span>
        <br>
        تجاوزت الهدف بـ
        <span class="difference">
            ${difference.toFixed(2)} ثانية
        </span>`;
    if (
        round === 2
    ) {
        nextButton.textContent =
            "إنهاء اللعبة";
    }
    else {
        nextButton.textContent =
            "الجولة التالية";
    }
    lossOverlay.classList.add(
        "show"
    );
}
/* =========================
   الزر الرئيسي
========================= */
mainButton.addEventListener(
    "click",
    function() {
        if (
            mainButton.classList.contains(
                "disabled"
            )
        ) {
            return;
        }
        if (running) {
            stopByUser();
        }
        else {
            startTimer();
        }
    }
);
/* =========================
   الجولة التالية
========================= */
nextButton.addEventListener(
    "click",
    function() {
        lossOverlay.classList.remove(
            "show"
        );
        /*
        الجولة الثالثة
        */
        if (
            round === 2
        ) {
            endOverlay.classList.add(
                "show"
            );
            return;
        }
        /*
        الانتقال للجولة التالية
        */
        round++;
        currentTime = 0;
        running = false;
        if (animationFrame) {
            cancelAnimationFrame(
                animationFrame
            );
            animationFrame = null;
        }
        /*
        إظهار معلومات الجولة الجديدة
        */
        roundInstruction.style.display =
            "block";
        targetBox.style.display =
            "block";
        /*
        إزالة وضع الإخفاء
        مؤقتًا حتى تظهر
        تعليمات الجولة الجديدة
        */
        document.body.classList.remove(
            "hidden-playing"
        );
        game.classList.remove(
            "playing"
        );
        mainButton.classList.remove(
            "disabled"
        );
        mainButton.textContent =
            "ابدأ";
        status.textContent =
            "انتبه للهدف قبل أن تبدأ";
        if (
            selectedMode === "hide"
        ) {
            info.textContent =
                "تذكر الهدف ثم اضغط ابدأ";
        }
        else {
            info.textContent =
                "الوقت سيظهر أثناء اللعب";
        }
        resetCircle();
        updateRoundInfo();
    }
);
/* =========================
   إعادة اللعبة
========================= */
restartButton.addEventListener(
    "click",
    function() {
        endOverlay.classList.remove(
            "show"
        );
        round = 0;
        currentTime = 0;
        running = false;
        if (animationFrame) {
            cancelAnimationFrame(
                animationFrame
            );
            animationFrame = null;
        }
        document.body.classList.remove(
            "hidden-playing"
        );
        game.classList.remove(
            "playing"
        );
        roundInstruction.style.display =
            "block";
        targetBox.style.display =
            "block";
        mainButton.classList.remove(
            "disabled"
        );
        mainButton.textContent =
            "ابدأ";
        status.textContent =
            "انتبه للهدف قبل أن تبدأ";
        if (
            selectedMode === "hide"
        ) {
            info.textContent =
                "تذكر الهدف ثم اضغط ابدأ";
        }
        else {
            info.textContent =
                "الوقت سيظهر أثناء اللعب";
        }
        resetCircle();
        updateRoundInfo();
    }
);
/* =========================
   التشغيل الأول
========================= */
updateRoundInfo();
resetCircle();
